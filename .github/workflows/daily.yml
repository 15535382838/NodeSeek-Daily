name: NodeSeek 自动签到评论加鸡腿

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '00 16 * * *'

jobs:
  run-nodeseek-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version

      - name: Install matching ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
          CHROME_MAJOR=$(echo "$CHROME_VERSION" | cut -d. -f1)
          echo "Chrome $CHROME_VERSION, major=$CHROME_MAJOR"
          DRIVER_VERSION=$(curl -fsSL "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${CHROME_MAJOR}")
          echo "ChromeDriver $DRIVER_VERSION"
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${DRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          unzip -q chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NodeSeek script
        env:
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          NS_RANDOM: ${{ secrets.NS_RANDOM }}
          HEADLESS: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 2
          python -u - <<'PY'
          import os, shutil, subprocess, sys, tempfile, types
          import undetected_chromedriver as _uc

          print("准备启动...", flush=True)

          ver = int(subprocess.check_output(
              ["google-chrome", "--version"], text=True
          ).split()[2].split(".")[0])
          print(f"Chrome major={ver}", flush=True)

          tmpdir = tempfile.mkdtemp()
          driver = os.path.join(tmpdir, "chromedriver")
          shutil.copy2("/usr/local/bin/chromedriver", driver)
          os.chmod(driver, 0o755)
          print(f"driver copy={driver}", flush=True)

          def _make_chrome(options=None, **kwargs):
              print("正在启动 Chrome...", flush=True)
              return _uc.Chrome(
                  options=options,
                  version_main=ver,
                  driver_executable_path=driver,
                  browser_executable_path="/usr/bin/google-chrome",
                  use_subprocess=True,
                  **kwargs,
              )

          shim = types.ModuleType("undetected_chromedriver")
          shim.ChromeOptions = _uc.ChromeOptions
          shim.Chrome = _make_chrome
          sys.modules["undetected_chromedriver"] = shim

          with open("nodeseek_daily.py", encoding="utf-8") as f:
              code = compile(f.read(), "nodeseek_daily.py", "exec")
          exec(code, {"__name__": "__main__", "__file__": "nodeseek_daily.py"})
          PY
